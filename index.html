<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>RebrandMe</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400;1,6..96,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --text: #ffffff;
  --muted: rgba(255, 255, 255, 0.5);
  --header-h: 72px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  touch-action: none;
}

body {
  font-family: 'Outfit', system-ui, -apple-system, sans-serif;
  position: fixed;
  inset: 0;
  height: 100dvh;
  background: #000000;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 0;
  margin: 0;
  -webkit-user-select: none;
  user-select: none;
}

header {
  text-align: center;
  padding: 8px 12px 4px;
  padding-top: max(8px, var(--safe-top));
  width: 100%;
  flex: 0 0 auto;
  z-index: 10;
}

.app-title {
  font-family: 'Bodoni Moda', serif;
  font-size: clamp(1.25rem, 5.5vw, 2.4rem);
  font-weight: 500;
  letter-spacing: 0.5px;
  color: #ffffff;
  line-height: 1.1;
  margin-bottom: 2px;
}

#pageTitle {
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 0;
  padding: 4px 4px;
  font-family: 'Bodoni Moda', serif;
  font-size: clamp(0.9rem, 3.8vw, 1.35rem);
  font-weight: 500;
  color: #ffffff;
  text-align: center;
  letter-spacing: 0.3px;
  width: min(480px, 90vw);
  outline: none;
  transition: border-color 0.2s ease;
  -webkit-user-select: text;
  user-select: text;
  touch-action: manipulation;
}

#pageTitle:focus {
  border-bottom-color: rgba(255, 255, 255, 0.7);
}

#pageTitle::placeholder {
  color: rgba(255, 255, 255, 0.35);
  font-weight: 500;
}

.main-container {
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: stretch;
  padding: 2px 8px max(6px, var(--safe-bottom));
  overflow: hidden;
}

.collage-wrapper {
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: stretch;
  justify-content: center;
  position: relative;
  touch-action: none;
  padding: 0 2px 18px;
  overflow: hidden;
}

.collage {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  grid-template-rows: 1fr 1.15fr 0.75fr 1.15fr;
  grid-template-areas:
    "tall topright"
    "tall midright"
    "smallleft midright"
    "bottom bottom";
  gap: clamp(4px, 1.2vw, 8px);
  width: 100%;
  height: 100%;
  max-height: 100%;
  transition: transform 0.28s ease, opacity 0.28s ease;
  will-change: transform, opacity;
}

.collage.slide-left {
  animation: slideInFromRight 0.28s ease;
}

.collage.slide-right {
  animation: slideInFromLeft 0.28s ease;
}

@keyframes slideInFromRight {
  from { transform: translateX(28%); opacity: 0.35; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes slideInFromLeft {
  from { transform: translateX(-28%); opacity: 0.35; }
  to { transform: translateX(0); opacity: 1; }
}

.slot {
  position: relative;
  background: rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1.5px dashed rgba(255, 255, 255, 0.25);
  border-radius: clamp(10px, 2.5vw, 16px);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.25s ease, background 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  min-height: 0;
}

.slot:active {
  border-color: rgba(255, 255, 255, 0.5);
  background: rgba(255, 255, 255, 0.12);
}

.slot.has-image {
  border: none;
  background: transparent;
}

.slot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: inherit;
  pointer-events: none;
}

.plus {
  font-family: 'Outfit', sans-serif;
  font-size: clamp(1.6rem, 7vw, 3rem);
  font-weight: 300;
  color: rgba(255, 255, 255, 0.45);
  pointer-events: none;
}

.remove-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 28px;
  height: 28px;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(4px);
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2;
  touch-action: manipulation;
}

.slot.has-image.show-delete .remove-btn {
  display: flex;
}

.remove-btn:active {
  background: rgba(220, 38, 38, 0.85);
}

.page-indicator {
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Outfit', sans-serif;
  font-size: 0.7rem;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.45);
  letter-spacing: 1px;
  pointer-events: none;
  z-index: 5;
  white-space: nowrap;
}

.swipe-hint {
  position: absolute;
  bottom: 2px;
  right: 8px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.28);
  letter-spacing: 0.4px;
  pointer-events: none;
  z-index: 5;
}

@media (max-width: 640px) {
  header {
    padding: 4px 8px 2px;
    padding-top: max(4px, var(--safe-top));
  }
  .main-container {
    padding: 0 4px max(4px, var(--safe-bottom));
  }
  .collage-wrapper {
    padding: 0 2px 16px;
  }
}
</style>
</head>
<body>
<header>
  <h1 class="app-title">RebrandMe</h1>
  <input id="pageTitle" type="text" placeholder="Name this collage" maxlength="40" enterkeyhint="done">
</header>

<div class="main-container">
  <div class="collage-wrapper" id="collageWrapper">
    <div class="collage" id="collage">
      <div class="slot" data-index="0" style="grid-area: tall;">
        <span class="plus">+</span>
        <button type="button" class="remove-btn" aria-label="Remove image" data-index="0">×</button>
      </div>
      <div class="slot" data-index="1" style="grid-area: topright;">
        <span class="plus">+</span>
        <button type="button" class="remove-btn" aria-label="Remove image" data-index="1">×</button>
      </div>
      <div class="slot" data-index="2" style="grid-area: midright;">
        <span class="plus">+</span>
        <button type="button" class="remove-btn" aria-label="Remove image" data-index="2">×</button>
      </div>
      <div class="slot" data-index="3" style="grid-area: smallleft;">
        <span class="plus">+</span>
        <button type="button" class="remove-btn" aria-label="Remove image" data-index="3">×</button>
      </div>
      <div class="slot" data-index="4" style="grid-area: bottom;">
        <span class="plus">+</span>
        <button type="button" class="remove-btn" aria-label="Remove image" data-index="4">×</button>
      </div>
    </div>
    <div class="page-indicator" id="pageIndicator">1 / 1</div>
    <div class="swipe-hint" id="swipeHint">swipe ← →</div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
const STORAGE_KEY = 'rebrandme_collages_v1';

let pages = [];
let currentIndex = 0;
let activeSlot = null;
let wasSwipe = false;
let animating = false;

const collage = document.getElementById('collage');
const pageTitleInput = document.getElementById('pageTitle');
const pageIndicator = document.getElementById('pageIndicator');
const swipeHint = document.getElementById('swipeHint');
const fileInput = document.getElementById('fileInput');
const slots = document.querySelectorAll('.slot');
const wrapper = document.getElementById('collageWrapper');

function blankPage() {
  return { title: '', images: [null, null, null, null, null] };
}

function loadPages() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) pages = JSON.parse(saved);
  } catch (e) {
    console.warn('Could not load saved collages');
  }
  if (!Array.isArray(pages) || !pages.length) {
    pages = [blankPage()];
  }
  pages.forEach(p => {
    if (!p.images || p.images.length !== 5) p.images = [null, null, null, null, null];
    if (typeof p.title !== 'string') p.title = '';
  });
}

function savePages() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
  } catch (e) {
    console.warn('Storage full or unavailable');
  }
}

function render(direction) {
  const page = pages[currentIndex];
  pageTitleInput.value = page.title || '';

  slots.forEach((slot, i) => {
    const imgData = page.images[i];
    const existingImg = slot.querySelector('img');
    if (existingImg) existingImg.remove();
    slot.classList.remove('show-delete');

    if (imgData) {
      const img = document.createElement('img');
      img.src = imgData;
      img.alt = 'Collage photo';
      slot.appendChild(img);
      slot.classList.add('has-image');
      slot.querySelector('.plus').style.display = 'none';
    } else {
      slot.classList.remove('has-image');
      slot.querySelector('.plus').style.display = 'flex';
    }
  });

  pageIndicator.textContent = `${currentIndex + 1} / ${pages.length}`;
  swipeHint.textContent = currentIndex === pages.length - 1 ? 'swipe ← new' : 'swipe ← →';

  if (direction) {
    collage.classList.remove('slide-left', 'slide-right');
    // Force reflow so animation restarts
    void collage.offsetWidth;
    collage.classList.add(direction === 'next' ? 'slide-left' : 'slide-right');
  }
}

function goTo(index, direction) {
  if (animating) return;
  if (index < 0) return;

  if (index >= pages.length) {
    // Only add a fresh page when moving past the last one
    pages.push(blankPage());
    savePages();
  }

  const dir = direction || (index > currentIndex ? 'next' : 'prev');
  currentIndex = index;
  animating = true;
  render(dir);
  setTimeout(() => { animating = false; }, 280);
}

function handleTitleInput() {
  pages[currentIndex].title = pageTitleInput.value.trim();
  savePages();
}

function triggerFile(slotIndex) {
  activeSlot = slotIndex;
  fileInput.click();
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file || activeSlot === null) return;

  const reader = new FileReader();
  reader.onload = function(ev) {
    pages[currentIndex].images[activeSlot] = ev.target.result;
    savePages();
    render();
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
}

function clearDeleteButtons(exceptSlot) {
  slots.forEach(slot => {
    if (slot !== exceptSlot) slot.classList.remove('show-delete');
  });
}

function removeImage(index, e) {
  e.preventDefault();
  e.stopPropagation();
  pages[currentIndex].images[index] = null;
  savePages();
  render();
}

slots.forEach(slot => {
  const idx = parseInt(slot.dataset.index, 10);
  slot.addEventListener('click', (e) => {
    if (wasSwipe) {
      e.preventDefault();
      e.stopPropagation();
      wasSwipe = false;
      return;
    }
    if (e.target.closest('.remove-btn')) return;

    // Filled image: first tap shows delete; empty slot opens picker
    if (slot.classList.contains('has-image')) {
      const alreadyShowing = slot.classList.contains('show-delete');
      clearDeleteButtons(slot);
      if (alreadyShowing) {
        slot.classList.remove('show-delete');
      } else {
        slot.classList.add('show-delete');
      }
      return;
    }

    clearDeleteButtons();
    triggerFile(idx);
  });
  const removeBtn = slot.querySelector('.remove-btn');
  if (removeBtn) {
    removeBtn.addEventListener('click', (e) => removeImage(idx, e));
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.slot')) clearDeleteButtons();
});

pageTitleInput.addEventListener('input', handleTitleInput);
pageTitleInput.addEventListener('change', handleTitleInput);
pageTitleInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    pageTitleInput.blur();
  }
});

fileInput.addEventListener('change', handleFile);

// Horizontal swipe: touch + pointer for phones and desktop
let startX = 0;
let startY = 0;
let isTracking = false;
let hasMoved = false;
let lockedAxis = null; // 'x' | 'y' | null

function beginSwipe(x, y, target) {
  if (target.closest('.remove-btn') || target.closest('input')) return false;
  startX = x;
  startY = y;
  isTracking = true;
  hasMoved = false;
  lockedAxis = null;
  wasSwipe = false;
  return true;
}

function moveSwipe(x, y) {
  if (!isTracking) return;
  const dx = x - startX;
  const dy = y - startY;
  const adx = Math.abs(dx);
  const ady = Math.abs(dy);

  if (!lockedAxis && (adx > 8 || ady > 8)) {
    lockedAxis = adx > ady ? 'x' : 'y';
    hasMoved = true;
  }

  if (lockedAxis === 'x') {
    // Light drag feedback while swiping
    const drag = Math.max(-60, Math.min(60, dx * 0.35));
    collage.style.transform = `translateX(${drag}px)`;
    collage.style.opacity = String(1 - Math.min(0.35, Math.abs(dx) / 280));
  }
}

function endSwipe(x, y) {
  if (!isTracking) return;
  isTracking = false;

  collage.style.transform = '';
  collage.style.opacity = '';

  if (!hasMoved || lockedAxis !== 'x') return;

  const diffX = startX - x;
  const diffY = Math.abs(startY - y);

  if (Math.abs(diffX) > 36 && Math.abs(diffX) > diffY * 1.15) {
    wasSwipe = true;
    if (diffX > 0) {
      goTo(currentIndex + 1, 'next'); // swipe left → next / new page
    } else {
      goTo(currentIndex - 1, 'prev'); // swipe right → previous
    }
    // Clear click ghost on next tick
    setTimeout(() => { wasSwipe = false; }, 320);
  }
}

wrapper.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  beginSwipe(e.clientX, e.clientY, e.target);
  if (isTracking && e.pointerType !== 'mouse') {
    try { wrapper.setPointerCapture(e.pointerId); } catch (_) {}
  }
});

wrapper.addEventListener('pointermove', (e) => {
  moveSwipe(e.clientX, e.clientY);
});

wrapper.addEventListener('pointerup', (e) => {
  endSwipe(e.clientX, e.clientY);
});

wrapper.addEventListener('pointercancel', () => {
  isTracking = false;
  collage.style.transform = '';
  collage.style.opacity = '';
});

// Block browser overscroll / pull-to-refresh interference
document.addEventListener('touchmove', (e) => {
  if (e.target.closest('input')) return;
  e.preventDefault();
}, { passive: false });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') goTo(currentIndex - 1, 'prev');
  if (e.key === 'ArrowRight') goTo(currentIndex + 1, 'next');
});

// Keep layout locked when mobile browser chrome shows/hides
function lockViewport() {
  document.body.style.height = `${window.innerHeight}px`;
}
window.addEventListener('resize', lockViewport);
window.addEventListener('orientationchange', () => setTimeout(lockViewport, 120));
lockViewport();

loadPages();
render();
</script>
</body>
</html>
