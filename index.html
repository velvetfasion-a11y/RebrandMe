<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RebrandMe</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400;1,6..96,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --text: #ffffff;
  --muted: rgba(255, 255, 255, 0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Outfit', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  height: 100vh;
  height: 100dvh;
  background: #000000;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0;
  margin: 0;
  overflow: hidden;
  -webkit-overflow-scrolling: none;
}

header {
  text-align: center;
  padding: 12px 16px 6px;
  width: 100%;
  flex-shrink: 0;
  z-index: 10;
  padding-top: max(12px, env(safe-area-inset-top));
}

.app-title {
  font-family: 'Bodoni Moda', serif;
  font-size: 2.9rem;
  font-weight: 500;
  letter-spacing: 0.5px;
  color: #ffffff;
  text-transform: none;
  margin-bottom: 4px;
  font-style: normal;
}

#pageTitle {
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 0;
  padding: 6px 4px;
  font-family: 'Bodoni Moda', serif;
  font-size: 1.55rem;
  font-weight: 500;
  font-style: normal;
  color: #ffffff;
  text-align: center;
  text-transform: none;
  letter-spacing: 0.3px;
  width: min(480px, 90vw);
  outline: none;
  transition: border-color 0.2s ease;
}

#pageTitle:focus {
  border-bottom-color: rgba(255, 255, 255, 0.7);
}

#pageTitle::placeholder {
  color: rgba(255, 255, 255, 0.35);
  font-weight: 500;
  text-transform: none;
  letter-spacing: 0.5px;
}

.main-container {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4px 10px 8px;
  min-height: 0;
  overflow: hidden;
}

.collage-wrapper {
  width: 100%;
  max-width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  padding: 0 4px;
}

.collage {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  grid-template-rows: 1fr 1.15fr 0.75fr 1.15fr;
  grid-template-areas:
    "tall topright"
    "tall midright"
    "smallleft midright"
    "bottom bottom";
  gap: 8px;
  width: 100%;
  height: 100%;
  max-height: 100%;
}

.slot {
  position: relative;
  background: rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1.5px dashed rgba(255, 255, 255, 0.25);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: pan-y;
}

.slot:hover {
  border-color: rgba(255, 255, 255, 0.5);
  background: rgba(255, 255, 255, 0.12);
}

.slot.has-image {
  border: none;
  background: transparent;
}

.slot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 16px;
  pointer-events: none; /* let parent handle swipes and clicks */
}

.plus {
  font-family: 'Outfit', sans-serif;
  font-size: 3rem;
  font-weight: 300;
  color: rgba(255, 255, 255, 0.45);
  user-select: none;
  pointer-events: none;
  transition: all 0.2s ease;
}

.slot:hover .plus {
  transform: scale(1.08);
  color: #ffffff;
}

.remove-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(4px);
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2;
  transition: background 0.2s;
}

.slot.has-image:hover .remove-btn {
  display: flex;
}

.remove-btn:hover {
  background: rgba(220, 38, 38, 0.85);
}

.page-indicator {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Outfit', sans-serif;
  font-size: 0.75rem;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.4);
  letter-spacing: 1px;
  pointer-events: none;
  z-index: 5;
}

@media (max-width: 640px) {
  .app-title { 
    font-size: 1.4rem; 
    letter-spacing: 0.2px; 
    margin-bottom: 0;
    line-height: 1.1;
  }
  #pageTitle { 
    font-size: 0.95rem; 
    padding: 2px 2px;
    margin-top: 2px;
  }
  .collage { 
    gap: 5px; 
  }
  .plus { 
    font-size: 1.8rem; 
  }
  .slot {
    border-radius: 10px;
  }
  .slot img {
    border-radius: 10px;
  }
  .main-container {
    padding: 0 4px 4px;
  }
  header {
    padding: 4px 8px 0;
    padding-top: max(4px, env(safe-area-inset-top));
  }
  .page-indicator {
    font-size: 0.55rem;
    bottom: 2px;
  }
}
</style>
</head>
<body>
<header>
  <h1 class="app-title">RebrandMe</h1>
  <input id="pageTitle" type="text" placeholder="RebrandMe" maxlength="40">
</header>

<div class="main-container">
  <div class="collage-wrapper" id="collageWrapper">
    <div class="collage" id="collage">
      <div class="slot" data-index="0" style="grid-area: tall;">
        <span class="plus">+</span>
        <button class="remove-btn" data-index="0">×</button>
      </div>
      <div class="slot" data-index="1" style="grid-area: topright;">
        <span class="plus">+</span>
        <button class="remove-btn" data-index="1">×</button>
      </div>
      <div class="slot" data-index="2" style="grid-area: midright;">
        <span class="plus">+</span>
        <button class="remove-btn" data-index="2">×</button>
      </div>
      <div class="slot" data-index="3" style="grid-area: smallleft;">
        <span class="plus">+</span>
        <button class="remove-btn" data-index="3">×</button>
      </div>
      <div class="slot" data-index="4" style="grid-area: bottom;">
        <span class="plus">+</span>
        <button class="remove-btn" data-index="4">×</button>
      </div>
    </div>
    <div class="page-indicator" id="pageIndicator">1 / 1</div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
const STORAGE_KEY = 'rebrandme_collages_v1';

let pages = [];
let currentIndex = 0;
let activeSlot = null;

const collage = document.getElementById('collage');
const pageTitleInput = document.getElementById('pageTitle');
const pageIndicator = document.getElementById('pageIndicator');
const fileInput = document.getElementById('fileInput');
const slots = document.querySelectorAll('.slot');

function loadPages() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      pages = JSON.parse(saved);
    }
  } catch (e) {
    console.warn('Could not load saved collages');
  }
  if (!pages.length) {
    pages = [{ title: '', images: [null, null, null, null, null] }];
  }
  pages.forEach(p => {
    if (!p.images || p.images.length !== 5) p.images = [null,null,null,null,null];
    if (typeof p.title !== 'string') p.title = '';
  });
}

function savePages() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
  } catch (e) {
    console.warn('Storage full or unavailable');
  }
}

function render() {
  const page = pages[currentIndex];
  pageTitleInput.value = page.title || '';
  pageTitleInput.placeholder = 'RebrandMe';

  slots.forEach((slot, i) => {
    const imgData = page.images[i];
    const existingImg = slot.querySelector('img');
    if (existingImg) existingImg.remove();

    if (imgData) {
      const img = document.createElement('img');
      img.src = imgData;
      img.alt = 'Collage photo';
      slot.appendChild(img);
      slot.classList.add('has-image');
      slot.querySelector('.plus').style.display = 'none';
    } else {
      slot.classList.remove('has-image');
      slot.querySelector('.plus').style.display = 'flex';
    }
  });

  pageIndicator.textContent = `${currentIndex + 1} / ${pages.length}`;
}

function goTo(index) {
  if (index < 0) return;
  if (index >= pages.length) {
    pages.push({ title: '', images: [null, null, null, null, null] });
    savePages();
  }
  currentIndex = index;
  render();
}

function handleTitleInput() {
  pages[currentIndex].title = pageTitleInput.value.trim();
  savePages();
}

function triggerFile(slotIndex) {
  activeSlot = slotIndex;
  fileInput.click();
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file || activeSlot === null) return;

  const reader = new FileReader();
  reader.onload = function(ev) {
    pages[currentIndex].images[activeSlot] = ev.target.result;
    savePages();
    render();
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
}

function removeImage(index, e) {
  e.stopPropagation();
  pages[currentIndex].images[index] = null;
  savePages();
  render();
}

// Event listeners
let wasSwipe = false;

slots.forEach(slot => {
  const idx = parseInt(slot.dataset.index);
  slot.addEventListener('click', (e) => {
    if (wasSwipe) {
      e.preventDefault();
      e.stopPropagation();
      wasSwipe = false;
      return;
    }
    triggerFile(idx);
  });
  const removeBtn = slot.querySelector('.remove-btn');
  if (removeBtn) {
    removeBtn.addEventListener('click', (e) => removeImage(idx, e));
  }
});

pageTitleInput.addEventListener('input', handleTitleInput);
pageTitleInput.addEventListener('change', handleTitleInput);

fileInput.addEventListener('change', handleFile);

// Improved swipe support (pointer events for better reliability on touch + mouse)
let startX = 0;
let startY = 0;
let isPointerDown = false;
let hasMoved = false;

const wrapper = document.getElementById('collageWrapper');

function handlePointerDown(e) {
  // Ignore only remove button and inputs — allow swipe to start on images/slots
  if (e.target.closest('.remove-btn') || e.target.closest('input')) return;
  startX = e.clientX;
  startY = e.clientY;
  isPointerDown = true;
  hasMoved = false;
  wasSwipe = false;
}

function handlePointerMove(e) {
  if (!isPointerDown) return;
  const dx = Math.abs(e.clientX - startX);
  const dy = Math.abs(e.clientY - startY);
  if (dx > 10 || dy > 10) hasMoved = true;
}

function handlePointerUp(e) {
  if (!isPointerDown) return;
  isPointerDown = false;

  if (!hasMoved) return; // treat as click, not swipe

  const endX = e.clientX;
  const diffX = startX - endX;
  const diffY = Math.abs(startY - e.clientY);

  // Require mostly horizontal movement
  if (Math.abs(diffX) > 40 && Math.abs(diffX) > diffY * 1.5) {
    wasSwipe = true;
    if (diffX > 0) {
      goTo(currentIndex + 1); // swipe left → next
    } else {
      goTo(currentIndex - 1); // swipe right → prev
    }
    // Prevent any following click
    e.preventDefault();
    e.stopPropagation();
  }
}

wrapper.addEventListener('pointerdown', handlePointerDown);
document.addEventListener('pointermove', handlePointerMove);
document.addEventListener('pointerup', handlePointerUp);
document.addEventListener('pointercancel', () => { isPointerDown = false; });

// Prevent text selection while swiping
wrapper.style.userSelect = 'none';
wrapper.style.webkitUserSelect = 'none';

// Keyboard still works for convenience
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') goTo(currentIndex - 1);
  if (e.key === 'ArrowRight') goTo(currentIndex + 1);
});

// Init
loadPages();
render();
</script>
</body>
</html>
